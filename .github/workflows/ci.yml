name: Flutter CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: freshflow
        run: flutter pub get

      - name: Analyze Project
        working-directory: freshflow
        run: flutter analyze

      - name: Run Tests
        working-directory: freshflow
        run: flutter test
