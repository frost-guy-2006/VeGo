name: Build & Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: false

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes "y" 2>/dev/null | flutter doctor --android-licenses || true

      - name: Create .env file
        working-directory: freshflow
        run: |
          echo "SUPABASE_URL=https://xstagwqwesafzirsxhjw.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzdGFnd3F3ZXNhZnppcnN4aGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyNDM1NDAsImV4cCI6MjA4NDgxOTU0MH0.-dy7yonmaOf1brijFlzMiS75ve99aeTPiih0CFoxncU" >> .env

      - name: Install Dependencies
        working-directory: freshflow
        run: flutter pub get

      - name: Build Universal APK
        working-directory: freshflow
        run: |
          set +e
          flutter build apk --release -v > build_output.log 2>&1
          EXIT_CODE=$?
          echo "Flutter build exited with code $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi

      - name: Push Diagnostics Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tail -n 250 freshflow/build_output.log > ./build_failure_diagnostic.log || true
          git add ./build_failure_diagnostic.log || true
          git commit -m "ci: auto-capture build failure diagnostic [skip ci]" || true
          git push origin master || true

      - name: Prepare Release APK
        run: |
          mkdir -p release-apks
          cp freshflow/build/app/outputs/flutter-apk/app-release.apk release-apks/FreshFlow-Release.apk
          ls -lh release-apks/FreshFlow-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshflow-apk
          path: release-apks/FreshFlow-Release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'VeGo v1.0.0 (Latest Release)' }}
          draft: false
          prerelease: false
          files: release-apks/FreshFlow-Release.apk
          body: |
            ### 🚀 FreshFlow / VeGo Release

            Welcome to the latest build of FreshFlow!

            #### 📱 What's New & Fixed:
            * **YouPI-PG Gateway Integration:** Zero-fee self-hosted UPI payments (Google Pay, PhonePe, Paytm, Dynamic QR) and Cash on Delivery (COD).
            * **Order State Sync:** Automated order loading and caching from Supabase on app launch.
            * **Cart Integrity:** Order undo rehydrates cart items safely.
            * **Full Session Logout Cleanup:** Complete cache wipe for cart, wishlist, address, and orders on logout.
            * **Reorder Quantity Preservation:** Reordering retains original quantities.
            * **Performance Polish:** Replaced continuously ticking shimmer animation controllers with native Shimmer widgets.

            #### 📥 Download:
            Download **FreshFlow-Release.apk** attached below to install directly on Android devices!
